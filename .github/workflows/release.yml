name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - run: python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: Wood-Windows-x64
          path: release/*
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} release/WoodSetup.exe release/WoodLauncher.exe release/WoodModPackager.exe release/SHA256SUMS.txt --generate-notes --title "Wood ${{ github.ref_name }}"
